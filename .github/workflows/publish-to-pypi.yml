name: Publish Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          import os
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              metadata_path, = (
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              )
              metadata = BytesParser().parsebytes(archive.read(metadata_path))
          expected_tag = f"v{metadata['Version']}"
          if os.environ["RELEASE_TAG"] != expected_tag:
              raise SystemExit(f"Release tag must match package version: {expected_tag}")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ github.event.release.tag_name }}
          path: dist/*
          if-no-files-found: error
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: "1"
        run: python -m twine upload dist/*
