name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: python -m pip install -e '.[dev,cog]'
      - name: Syntax check
        run: python -m compileall opensr_utils setup.py demo.py tests
      - name: Shell syntax check
        run: bash -n run_batch.sh
      - name: Behavior and CPU integration tests
        run: python -m pytest -q
      - name: Check test quality
        run: python -m ruff check tests && python -m ruff format --check tests
