name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: |
          python -m pip install -e '.[dev,cog]'
      - name: Syntax check
        run: python -m compileall opensr_utils setup.py tests examples
      - name: Shell syntax check
        run: bash -n run_batch.sh
      - name: Behavior and CPU integration tests
        run: >-
          python -m pytest -q
          --cov=opensr_utils
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-3.12.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-3.12
          path: coverage-3.12.xml
          if-no-files-found: ignore
      - name: Check test quality
        run: >-
          python -m ruff check opensr_utils tests examples setup.py
          && python -m ruff format --check opensr_utils tests examples setup.py
