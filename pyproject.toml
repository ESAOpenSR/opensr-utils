# pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "integration: exercises the real CPU inference or COG pipeline on local rasters",
    "known_bug: desired behavior blocked by a documented defect (strict xfail)",
]
